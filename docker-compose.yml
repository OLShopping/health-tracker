version: '3.8'

services:
  health-tracker:
    build:
      context: .
      args:
        - APP_VERSION=2.8                  # ← 每次更新代码后修改此版本号，触发重新构建

    container_name: health-tracker
    ports:
      - "4321:5555"

    volumes:
      - ./data:/data                   # 数据持久化
      - ./uploads:/app/static/uploads  # 上传文件持久化

    environment:
      - DB_PATH=/data/health.db
      - SECRET_KEY=change-me-in-production
      - TZ=Asia/Shanghai
      - PORT=5555
      - HEALTH_PORT=5555

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
